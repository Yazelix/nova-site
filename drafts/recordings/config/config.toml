[welcome]
enabled = false

[shell]
program = "nu"
atuin = true

[agent]
command = "codex"
args = ["--cd", "__NOVA_PRODUCT_REPO__", "--model", "gpt-5.6-sol", "--config", "model_reasoning_effort=\"medium\"", "--config", "features.apps=false", "--config", "features.plugins=false", "--config", "mcp_servers.node_repl.enabled=false", "--config", "mcp_servers.openaiDeveloperDocs.enabled=false", "--config", "tui.show_tooltips=false"]

[popups.anima]
command = "yzx"
args = ["anima", "mandelbrot"]
keybinding = "Alt Shift B"
